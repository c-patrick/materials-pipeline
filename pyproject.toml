[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "materials-pipeline"
version = "0.1.0"
description = "A provider-neutral materials data ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pymatgen",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"